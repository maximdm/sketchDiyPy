name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (base, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base + test deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" matplotlib pillow scikit-image python-multipart pytest httpx

      - name: Run tests
        run: pytest -q

  test-3d:
    name: Test (with 3D deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + 3D extras
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" matplotlib pillow scikit-image python-multipart pytest httpx build123d trimesh

      - name: Run tests
        run: pytest -q
